<div class="field check-field">
  <label for="{{ field.id_for_label }}">{{ field }} <span>{{ field.label }}</span></label>
  {% if field.help_text %}<p id="{{ field.auto_id }}_helptext" class="field-help">{{ field.help_text }}</p>{% endif %}
  {% if field.errors %}<div class="field-errors" role="alert">{{ field.errors }}</div>{% endif %}
</div>
