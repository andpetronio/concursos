<div class="aspirant-actions" role="group" aria-label="Acciones de {{ aspirante.persona.apellido }}, {{ aspirante.persona.nombre }}">
  {% if aspirante.puede_rendir %}
  <a class="aspirant-action aspirant-action--evaluation"
     href="{% url 'concursos:aspirante_evaluacion' concurso.pk aspirante.pk %}"
     aria-label="{% if aspirante.evaluacion %}Editar evaluación{% else %}Registrar evaluación{% endif %}"
     title="{% if aspirante.evaluacion %}Editar evaluación{% else %}Registrar evaluación{% endif %}"
     data-tooltip="{% if aspirante.evaluacion %}Editar evaluación{% else %}Registrar evaluación{% endif %}">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4.5V3h6v1.5M9 10h6M9 14h3"/><path d="m14.5 16 1.5 1.5 3.2-3.2"/></svg>
  </a>
  {% endif %}
  <button type="button" class="aspirant-menu-trigger"
          id="aspirant-menu-trigger-{{ aspirante.pk }}"
          popovertarget="aspirant-menu-{{ aspirante.pk }}"
          aria-label="Más acciones de {{ aspirante.persona.apellido }}, {{ aspirante.persona.nombre }}"
          aria-haspopup="true" aria-controls="aspirant-menu-{{ aspirante.pk }}"
          title="Más acciones">···</button>
  <div id="aspirant-menu-{{ aspirante.pk }}" class="aspirant-menu-links" popover="auto"
       aria-label="Acciones de {{ aspirante.persona.apellido }}, {{ aspirante.persona.nombre }}">
      <a href="{% url 'concursos:aspirante_situacion' concurso.pk aspirante.pk %}">Gestionar situación e historial</a>
      <a href="{% url 'concursos:aspirante_editar' concurso.pk aspirante.pk %}">Editar inscripción</a>
      {% url 'concursos:persona_editar' concurso.pk aspirante.persona.pk as persona_url %}
      {% with correction_url=persona_url|add:"?seccion=aspirantes" %}
        <a href="{{ correction_url }}">Corregir datos personales</a>
      {% endwith %}
  </div>
</div>
